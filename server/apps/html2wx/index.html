<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 复制工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #4a90e2;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 500;
        }

        .copy-btn {
            background: white;
            color: #4a90e2;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #f0f0f0;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor, .preview {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            background: #f5f5f5;
            padding: 10px 20px;
            font-size: 13px;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
        }

        textarea {
            flex: 1;
            border: none;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .preview-content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            background: white;
            border-left: 1px solid #e0e0e0;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>HTML 复制工具</h1>
        <button class="copy-btn" onclick="copyToClipboard()">复制内容</button>
    </div>

    <div class="container">
        <div class="editor">
            <div class="panel-title">HTML 代码（实时渲染）</div>
            <textarea id="htmlInput" placeholder="在这里输入 HTML 代码..." oninput="renderHtml()"><h1 style="color: #333; font-size: 28px; margin-bottom: 20px;">标题示例</h1>

<p style="color: #666; line-height: 1.8; margin-bottom: 15px;">这是一段普通文本，支持实时预览。修改左侧代码，右侧会立即显示效果。</p>

<p style="color: #e74c3c; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 4px;">这是一段高亮文本</p>

<ul style="color: #666; line-height: 2; margin: 15px 0 15px 20px;">
    <li>列表项 1</li>
    <li>列表项 2</li>
    <li>列表项 3</li>
</ul>

<blockquote style="border-left: 4px solid #4a90e2; padding-left: 15px; margin: 15px 0; color: #666; font-style: italic;">
    这是一段引用文本
</blockquote></textarea>
        </div>

        <div class="preview">
            <div class="panel-title">渲染预览</div>
            <div id="preview" class="preview-content"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // 页面加载时渲染
        window.onload = function() {
            renderHtml();
        };

        // 实时渲染
        function renderHtml() {
            const htmlInput = document.getElementById('htmlInput');
            const preview = document.getElementById('preview');
            preview.innerHTML = htmlInput.value;
        }

        // 复制到剪贴板
        function copyToClipboard() {
            const preview = document.getElementById('preview');
            
            const range = document.createRange();
            range.selectNodeContents(preview);
            
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('✅ 复制成功！');
                } else {
                    showToast('❌ 复制失败');
                }
            } catch (err) {
                showToast('❌ 复制失败');
            }
            
            selection.removeAllRanges();
        }

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
