    <style>
        body {
            touch-action: none;
            overflow: hidden;
            background: linear-gradient(180deg, #89CFF0 0%, #E0F2F1 100%);
        }

        .video-mirror {
            transform: scaleX(-1);
        }

        /* 前置镜像 */
        .video-normal {
            transform: scaleX(1);
        }

        /* 后置正常 */

        .textured-plastic {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* 动画 */
        @keyframes float-in-breeze {

            0%,
            100% {
                transform: translate(0, 0) rotate(var(--rot));
            }

            33% {
                transform: translate(2px, -3px) rotate(calc(var(--rot) + 0.5deg));
            }

            66% {
                transform: translate(-1px, 2px) rotate(calc(var(--rot) - 0.3deg));
            }
        }

        @keyframes flash-anim {
            0% {
                opacity: 0;
            }

            10% {
                opacity: 1;
                background: white;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes shutter-close {
            0% {
                transform: scale(1.5);
                opacity: 0;
            }

            40% {
                transform: scale(0.1);
                opacity: 1;
                background: #111;
            }

            60% {
                transform: scale(0.1);
                opacity: 1;
                background: #111;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        @keyframes number-pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .pop-anim {
            animation: number-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 状态类 */
        .polaroid-card.developed:not(.dragging) {
            animation: float-in-breeze 5s ease-in-out infinite;
        }

        .polaroid-card.dragging {
            cursor: grabbing;
            transition: none !important;
            z-index: 9999 !important;
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3);
            animation: none;
        }

        .flash-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
            animation: flash-anim 0.5s ease-out forwards;
        }

        .shutter-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
        }

        .shutter-active {
            animation: shutter-close 0.4s ease-in-out forwards;
        }

        .decoration-sticker {
            position: absolute;
            pointer-events: none;
            filter: drop-shadow(1px 2px 1px rgba(0, 0, 0, 0.1));
            z-index: 10;
            opacity: 0.95;
        }

        .save-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .save-btn:active {
            transform: scale(0.9);
        }
    </style>

    <script>
        const video = document.getElementById('camera-feed');
        const paperSlot = document.getElementById('paper-slot');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownText = document.getElementById('countdown-text');
        const lensShutter = document.getElementById('lens-shutter');
        const flashContainer = document.getElementById('flash-container');
        const shutterBtn = document.getElementById('shutter-btn');
        const flipBtn = document.getElementById('flip-btn');

        let zIndexCounter = 1000;
        let isCapturing = false;
        let currentStream = null;
        // 默认使用 environment (后置)，如果用户在PC端可能自动回退到 user
        let facingMode = "environment";

        // 1. 初始化摄像头
        async function initCamera() {
            // 停止之前的流 (切换摄像头必须步骤)
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1080 },
                        height: { ideal: 1080 }
                    }
                });
                currentStream = stream;
                video.srcObject = stream;

                // 关键优化：根据摄像头类型调整镜像
                // 后置(environment) -> 不镜像 (video-normal)
                // 前置(user) -> 镜像 (video-mirror)
                if (facingMode === 'user') {
                    video.classList.remove('video-normal');
                    video.classList.add('video-mirror');
                } else {
                    video.classList.remove('video-mirror');
                    video.classList.add('video-normal');
                }

            } catch (err) {
                console.error(err);
                // 如果请求后置失败(例如笔记本)，尝试回退到默认
                if (facingMode === 'environment') {
                    console.log("后置调用失败，尝试默认...");
                    facingMode = 'user';
                    initCamera();
                } else {
                    alert("无法访问摄像头，请确保在 HTTPS 环境下运行或允许权限 📷");
                }
            }
        }

        // 启动
        initCamera();

        // 2. 切换摄像头函数
        function switchCamera() {
            if (isCapturing) return;
            // 翻转模式
            facingMode = facingMode === 'user' ? 'environment' : 'user';

            // 添加按钮旋转动画反馈
            flipBtn.querySelector('svg').style.transition = 'transform 0.5s';
            flipBtn.querySelector('svg').style.transform = `rotate(${facingMode === 'user' ? 180 : 0}deg)`;

            initCamera();
        }

        // 3. 拍照流程 (包含倒计时)
        function startSequence() {
            if (isCapturing) return;
            isCapturing = true;
            shutterBtn.disabled = true;
            flipBtn.disabled = true; // 拍照时禁止切换

            let count = 3;
            updateCountdown(count);
            countdownOverlay.classList.remove('hidden');

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    updateCountdown(count);
                } else {
                    clearInterval(timer);
                    countdownOverlay.classList.add('hidden');
                    triggerShutterEffect();
                }
            }, 1000);
        }

        function updateCountdown(num) {
            countdownText.innerText = num;
            countdownText.classList.remove('pop-anim');
            void countdownText.offsetWidth;
            countdownText.classList.add('pop-anim');
        }

        // 4. 快门特效
        function triggerShutterEffect() {
            lensShutter.classList.add('shutter-active');
            setTimeout(() => {
                const flash = document.createElement('div');
                flash.className = 'flash-overlay';
                flashContainer.appendChild(flash);
                setTimeout(() => flash.remove(), 500);

                captureFrame();

                setTimeout(() => {
                    lensShutter.classList.remove('shutter-active');
                    isCapturing = false;
                    shutterBtn.disabled = false;
                    flipBtn.disabled = false;
                }, 400);
            }, 200);
        }

        // 5. 截图处理 (处理镜像问题)
        function captureFrame() {
            const canvas = document.createElement('canvas');
            const size = Math.min(video.videoWidth, video.videoHeight) || 640;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');

            // 这里的逻辑需要跟 CSS 的 transform 保持一致
            if (facingMode === 'user') {
                // 前置：需要镜像翻转回来
                ctx.translate(size, 0);
                ctx.scale(-1, 1);
            } else {
                // 后置：正常绘制
                ctx.translate(0, 0);
                ctx.scale(1, 1);
            }

            // 计算居中裁剪
            const startX = (video.videoWidth - size) / 2;
            const startY = (video.videoHeight - size) / 2;
            ctx.drawImage(video, startX, startY, size, size, 0, 0, size, size);

            generatePolaroid(canvas.toDataURL('image/jpeg', 0.95));
        }

        // 6. 生成相纸 (保持之前的逻辑)
        function generatePolaroid(imgData) {
            const slotRect = paperSlot.getBoundingClientRect();
            const card = document.createElement('div');
            card.className = "polaroid-card group absolute w-56 p-3 pb-6 bg-polaroid-white shadow-2xl flex flex-col items-center rounded overflow-hidden cursor-grab";

            card.style.left = `${slotRect.left + slotRect.width / 2 - 112}px`;
            card.style.top = `${slotRect.top}px`;
            card.style.transform = `scale(0.8)`;
            card.style.zIndex = 40;
            card.style.opacity = 0;
            card.style.transition = "transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.6s ease-out, opacity 0.2s";

            const img = document.createElement('img');
            img.src = imgData;
            img.className = "w-full h-48 object-cover bg-[#111] rounded-sm filter grayscale blur-[2px] contrast-125 brightness-75 transition-all duration-[5000ms] ease-out pointer-events-none border border-gray-100";

            const textDiv = document.createElement('div');
            textDiv.className = "mt-4 font-hand text-gray-700 text-xl text-center w-full min-h-[1.5em] px-1 z-20 relative leading-none";
            textDiv.innerText = "...";
            textDiv.onmousedown = (e) => e.stopPropagation();
            textDiv.ontouchstart = (e) => e.stopPropagation(); // 手机端也要阻止

            const dateDiv = document.createElement('div');
            const d = new Date();
            dateDiv.className = "absolute bottom-2 left-3 text-[9px] font-meta text-summer-sky/80 font-bold tracking-widest pointer-events-none";
            dateDiv.innerText = `${d.getFullYear()}.${(d.getMonth() + 1).toString().padStart(2, '0')}.${d.getDate()}`;

            const saveBtn = document.createElement('button');
            saveBtn.className = "save-btn absolute bottom-2 right-2 w-8 h-8 bg-summer-yellow text-gray-900 rounded-full flex items-center justify-center shadow-md opacity-0 group-hover:opacity-100 z-30 translate-y-2 group-hover:translate-y-0";
            saveBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12L12 16.5m0 0L16.5 12M12 16.5V3" /></svg>`;
            saveBtn.onmousedown = (e) => e.stopPropagation();
            saveBtn.ontouchstart = (e) => e.stopPropagation();
            saveBtn.onclick = () => savePhotoSafe(card, saveBtn);

            addDecorations(card);
            card.appendChild(img); card.appendChild(textDiv); card.appendChild(dateDiv); card.appendChild(saveBtn);
            document.body.appendChild(card);

            requestAnimationFrame(() => {
                card.style.opacity = 1;
                card.style.top = `${slotRect.top - 250}px`;
                card.style.zIndex = 60;
                card.style.transform = `scale(1)`;
            });

            setTimeout(() => { flyToRandomPos(card, img, textDiv); }, 800);
        }

        function flyToRandomPos(card, img, textDiv) {
            const safeX = Math.random() * (window.innerWidth * 0.8) + window.innerWidth * 0.1;
            const safeY = Math.random() * (window.innerHeight * 0.3) + 40;
            const rot = (Math.random() * 16) - 8;

            card.style.setProperty('--rot', `${rot}deg`);
            card.style.transition = "all 1s ease-in-out";
            card.style.left = `${safeX}px`;
            card.style.top = `${safeY}px`;
            card.style.transform = `rotate(${rot}deg)`;
            card.style.zIndex = zIndexCounter++;

            setTimeout(() => {
                card.style.transition = "";
                img.classList.remove('grayscale', 'blur-[2px]', 'contrast-125', 'brightness-75');
                img.classList.add('sepia-[0.1]', 'contrast-[1.05]');
                card.classList.add('developed');
                generateAiMood(textDiv);
            }, 1000);
        }

        function savePhotoSafe(card, btn) {
            const oldIcon = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>`;
            const clone = card.cloneNode(true);
            clone.style.transform = "none"; clone.style.animation = "none"; clone.style.transition = "none";
            clone.style.position = "fixed"; clone.style.left = "-9999px"; clone.style.top = "0";
            const b = clone.querySelector('button'); if (b) b.remove();
            document.body.appendChild(clone);
            html2canvas(clone, { backgroundColor: null, scale: 3, useCORS: true, logging: false }).then(canvas => {
                const a = document.createElement('a');
                a.download = `Summer_Instax_${Date.now()}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
            }).catch(console.error).finally(() => { document.body.removeChild(clone); btn.innerHTML = oldIcon; });
        }

        const comments = ["Sunny vibes.", "Keep smiling.", "Summer dream.", "Pure joy.", "Golden hour.", "Stay cool.", "Memory unlocked."];
        function generateAiMood(el) {
            el.innerText = "Developing...";
            setTimeout(() => {
                el.innerText = comments[Math.floor(Math.random() * comments.length)];
                el.onclick = () => { const t = prompt("写下此刻心情:", el.innerText); if (t) el.innerText = t; }
            }, 1500);
        }

        const svgs = [
            `<svg viewBox="0 0 24 24" fill="#FFD700" class="w-full h-full"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12z"/></svg>`,
            `<svg viewBox="0 0 24 24" fill="#4ade80" class="w-full h-full"><path d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm0 18c-4.556 0-8.25-3.694-8.25-8.25S7.444 3.75 12 3.75s8.25 3.694 8.25 8.25S16.556 20.25 12 20.25z"/><path d="M12 12a.75.75 0 01.75.75v3a.75.75 0 01-1.5 0v-3A.75.75 0 0112 12z" fill="#fff"/></svg>`,
            `<svg viewBox="0 0 24 24" fill="#ff6b6b" class="w-full h-full"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/></svg>`
        ];
        function addDecorations(el) {
            const count = Math.floor(Math.random() * 2) + 1;
            for (let i = 0; i < count; i++) {
                const d = document.createElement('div'); d.className = 'decoration-sticker';
                const s = Math.random() * 18 + 15; d.style.width = s + 'px'; d.style.height = s + 'px';
                d.style.left = Math.random() * 150 + 'px'; d.style.top = Math.random() > 0.5 ? Math.random() * 20 + 'px' : Math.random() * 20 + 200 + 'px';
                d.style.transform = `rotate(${Math.random() * 360}deg)`; d.innerHTML = svgs[Math.floor(Math.random() * svgs.length)];
                el.appendChild(d);
            }
        }

        // 拖拽逻辑 (触摸+鼠标)
        let activeCard = null, startX, startY, initX, initY;
        const startDrag = (e) => {
            const t = e.target.closest('.polaroid-card');
            if (!t || e.target.closest('.font-hand') || e.target.closest('button')) return;
            e.preventDefault(); activeCard = t; activeCard.classList.add('dragging'); activeCard.style.zIndex = zIndexCounter++;
            const point = e.touches ? e.touches[0] : e;
            startX = point.clientX; startY = point.clientY; initX = t.offsetLeft; initY = t.offsetTop;
        };
        const moveDrag = (e) => {
            if (!activeCard) return; e.preventDefault();
            const point = e.touches ? e.touches[0] : e;
            activeCard.style.left = (initX + point.clientX - startX) + 'px';
            activeCard.style.top = (initY + point.clientY - startY) + 'px';
        };
        const endDrag = () => { if (activeCard) { activeCard.classList.remove('dragging'); activeCard = null; } };
        document.addEventListener('mousedown', startDrag); document.addEventListener('mousemove', moveDrag); document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchstart', startDrag, { passive: false }); document.addEventListener('touchmove', moveDrag, { passive: false }); document.addEventListener('touchend', endDrag);
    </script>
